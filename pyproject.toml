[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zeckendorf-prune"
version = "0.1.0"
description = "Zeckendorf-constrained structured sparsity for neural networks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
export = ["onnx>=1.14", "onnxruntime>=1.15"]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
zeck = "zeckendorf_prune.cli:main"

[tool.setuptools.packages.find]
include = ["zeckendorf_prune*"]
